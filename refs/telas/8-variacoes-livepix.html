<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><title>PVZRA — Variações LivePix</title>
<!--
  ===== EDITE AQUI AS VARIAÇÕES =====
  Cada linha: ['valor', 'efeito'],
  Para adicionar, copie uma linha. Para tirar, apague a linha.
-->
<script>
const VARIACOES = [
  ['1,71', 'Lula'],
  ['6,66', 'Susto'],
  ['7,77', 'Michael Jackson'],
];
const TITULO = 'Variações especiais';
</script>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;600;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:transparent;overflow:hidden;font-family:"Sora",sans-serif;color:#f1f5f4}
.bar{position:absolute;left:10px;bottom:10px;display:flex;align-items:center;gap:18px;padding:12px 14px 12px 22px;border-radius:20px;overflow:hidden;
  background:linear-gradient(160deg,rgba(24,38,38,.92),rgba(8,14,14,.94));border:1px solid rgba(255,255,255,.12);
  box-shadow:0 18px 40px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.08)}
.bar::before{content:"";position:absolute;left:-200px;top:-300px;width:1400px;height:700px;transform:rotate(-14deg);z-index:0;
  background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);
  background-size:32px 32px;animation:g 14s linear infinite}
@keyframes g{to{background-position:32px 32px}}
.glow{position:absolute;inset:0;z-index:0;pointer-events:none;background:radial-gradient(60% 120% at 0% 100%,rgba(24,120,108,.4),transparent 70%)}
.in{position:relative;z-index:1;display:contents}
.k{position:relative;z-index:1;font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:#46e3be;display:flex;align-items:center;gap:7px;white-space:nowrap;line-height:1.35}
.k i{width:6px;height:6px;border-radius:50%;background:#0dbb95;box-shadow:0 0 8px #0dbb95;animation:b 1.6s ease-in-out infinite;flex:none}
@keyframes b{50%{opacity:.3}}
.sep{position:relative;z-index:1;width:1px;align-self:stretch;margin:4px 0;background:linear-gradient(transparent,rgba(255,255,255,.18),transparent)}
.chips{position:relative;z-index:1;display:flex;gap:10px}
.chip{display:flex;align-items:baseline;gap:9px;padding:9px 15px;border-radius:13px;white-space:nowrap;
  background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.09);transition:border-color .6s,background .6s,box-shadow .6s}
.chip b{font-weight:800;font-size:17px;letter-spacing:-.02em;color:#f1f5f4;transition:color .6s}
.chip b small{font-size:11px;font-weight:600;color:#93a6a2;margin-right:3px;letter-spacing:0}
.chip span{font-size:14px;font-weight:300;color:#c4d0cd}
.chip.on{border-color:rgba(70,227,190,.55);background:rgba(13,187,149,.12);box-shadow:0 0 22px rgba(13,187,149,.25)}
.chip.on b{color:#46e3be}
</style></head><body>
<div class="bar"><div class="glow"></div>
  <div class="k"><i></i><span id="tit"></span></div>
  <div class="sep"></div>
  <div class="chips" id="chips"></div>
</div>
<script>
document.getElementById('tit').innerHTML = TITULO.replace(' ', '<br>');
const box = document.getElementById('chips');
box.innerHTML = VARIACOES.map(([v, n]) => `<div class="chip"><b><small>R$</small>${v}</b><span>${n}</span></div>`).join('');
// destaque passa de uma variação para a outra, devagar
const chips = [...box.children]; let i = 0;
function tick(){ chips.forEach((c, j) => c.classList.toggle('on', j === i)); i = (i + 1) % chips.length; }
if (chips.length){ tick(); setInterval(tick, 3000); }
</script></body></html>
